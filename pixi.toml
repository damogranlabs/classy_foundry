[project]
authors = ["Nejc Jurkovič <nejc.jurkovic@proton.me>"]
channels = ["freecad/label/dev", "conda-forge"]
description = "A FreeCAD workbench to interactively and visually build classy_blocks meshes"
name = "freecad.classy_foundry"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64", "osx-64"]
version = "0.0.0"

[pypi-dependencies]
freecad-classy_foundry = { path = ".", editable = true }

[tasks]
test = "python tests/tests.py"

[dependencies]
freecad = ">=1.0.0,<2"